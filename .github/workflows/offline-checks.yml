name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python smokes/smoke_chat.py --model mock
      - run: python examples/growing_trajectory.py
      - run: python -m pytest tests
      - run: python -m unittest discover -s llm-behavior-demos/position_bias_demo -p 'test_*.py' -v
      - run: python -m unittest discover -s llm-behavior-demos/belief_bias_demo -p 'test_*.py' -v
